<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aleph — Matt Lubin</title>
  <meta name="description" content="An aleph lava lamp">
  <style>
    :root {
      --bg-light: #faf8f5;
      --bg-dark: #1a1614;
      --text-light: #2d2a26;
      --text-dark: #e8e4df;
      --text-muted-light: #6b6762;
      --text-muted-dark: #9a9288;
    }
    :root {
      --bg: var(--bg-light);
      --text: var(--text-light);
      --text-muted: var(--text-muted-light);
    }
    :root.dark {
      --bg: var(--bg-dark);
      --text: var(--text-dark);
      --text-muted: var(--text-muted-dark);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio L', P052, serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      padding: 1.5rem 2rem;
      text-align: center;
    }

    .header-nav {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .header-nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin: 0 0.4rem;
      transition: color 0.2s ease;
    }

    .header-nav a:hover { color: var(--text); }

    .theme-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0;
      margin: 0 0.4rem;
      transition: color 0.2s ease;
    }

    .theme-toggle:hover { color: var(--text); }

    /* Main layout — vertically centered */
    .aleph-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 2rem 5rem;
      gap: 1.75rem;
    }

    .aleph-heading {
      font-size: 1.05rem;
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .aleph-caption {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 340px;
      line-height: 1.8;
      font-style: italic;
    }

    /* ── Aleph lava lamp ────────────────────────────────────────── */
    .aleph-mxc-stage {
      width: 900px;
      height: 460px;
      position: relative;
      max-width: min(98vw, 900px);
      max-height: min(60vh, 460px);
    }

    .aleph-mxc-stage svg { width: 100%; height: 100%; display: block; overflow: visible; }

    .aleph-mxc-ch {
      transform-box: fill-box;
      transform-origin: center;
      /* Light mode: subtractive — overlaps darken toward black */
      mix-blend-mode: multiply;
    }

    /* Dark mode: additive — overlaps brighten toward white light */
    :root.dark .aleph-mxc-ch {
      mix-blend-mode: screen;
    }

    .spread-control {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #spread-slider {
      width: 140px;
      accent-color: var(--text-muted);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="header-nav">
      <a href="/index.html">[home]</a> ·
      <a href="/everything.html">[everything]</a> ·
      <a href="/contact.html">[contact]</a> ·
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span id="themeIcon">☾</span>
      </button>
    </nav>
  </header>

  <main class="aleph-page">
    <p class="aleph-heading">Aleph Lava Lamp</p>

    <div class="aleph-mxc-stage">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Animated aleph glyph" role="img">
        <defs>
          <symbol id="aleph-glyph" viewBox="50 1000 1080 1400" preserveAspectRatio="xMidYMid meet">
            <path fill="currentColor" d="M87 1192.5q11 63.5 16.5 108.5t5.5 87q0 47-7 89l154 95-154 682h306q7 4 17.5 8t18 9 12.5 13q12 20 19.5 40t14.5 45 14 43q25-38 30-46t26.5-45 28.5-57 15.5-52 8.5-61q0-44-17-85-13-30-33.5-54t-41-38-53.5-26.5-55.5-18.5-63-15.5T288 1898l66-254q61 57 136 140t133 146.5 126 129.5 144 115.5 159 78.5q61 0 75-32-14-67-14-142 0-143 16-240-8 7-25.5 26.5t-30.5 30-26 10.5q-6 0-13-3-47-13-83.5-36t-56.5-44.5-57.5-63.5-68.5-72q10-4 41.5-18t42.5-19.5 38.5-18.5 39-20 34-21 33-24 26-25 23-29 14.5-31 10-36q6-16 6-31 0-33-30-71t-71-71.5-97.5-91T782 1064q7 28 7 55 0 42-21.5 81t-46.5 62.5-67 59-62 56.5q5 4 37 16.5t66.5 28 72.5 46 56 67.5q4 12 4 16 0 48-130 80-88-107-190.5-194.5t-239.5-186T72 1105q4 24 15 87.5z"/>
          </symbol>

          <filter id="mxR" x="-25%" y="-25%" width="150%" height="150%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.022" numOctaves="2" seed="3">
              <animate attributeName="baseFrequency" dur="8s" values="0.008 0.018; 0.03 0.04; 0.008 0.018" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" scale="12"/>
            <feColorMatrix type="hueRotate" values="0">
              <animate attributeName="values" dur="15s" values="0;360" repeatCount="indefinite"/>
            </feColorMatrix>
          </filter>

          <filter id="mxG" x="-25%" y="-25%" width="150%" height="150%">
            <feTurbulence type="fractalNoise" baseFrequency="0.014 0.020" numOctaves="2" seed="11">
              <animate attributeName="baseFrequency" dur="8s" values="0.03 0.04; 0.008 0.018; 0.03 0.04" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" scale="12"/>
            <feColorMatrix type="hueRotate" values="0">
              <animate attributeName="values" dur="15s" values="0;360" repeatCount="indefinite"/>
            </feColorMatrix>
          </filter>

          <filter id="mxB" x="-25%" y="-25%" width="150%" height="150%">
            <feTurbulence type="fractalNoise" baseFrequency="0.010 0.024" numOctaves="2" seed="19">
              <animate attributeName="baseFrequency" dur="8s" values="0.018 0.03; 0.012 0.022; 0.018 0.03" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" scale="12"/>
            <feColorMatrix type="hueRotate" values="0">
              <animate attributeName="values" dur="15s" values="0;360" repeatCount="indefinite"/>
            </feColorMatrix>
          </filter>
        </defs>

        <g class="aleph-mxc-ch aleph-mxc-r" filter="url(#mxR)" style="color: oklch(0.65 0.22 25);">
          <use href="#aleph-glyph" x="35" y="35" width="130" height="130"/>
        </g>
        <g class="aleph-mxc-ch aleph-mxc-g" filter="url(#mxG)" style="color: oklch(0.7 0.22 145);">
          <use href="#aleph-glyph" x="35" y="35" width="130" height="130"/>
        </g>
        <g class="aleph-mxc-ch aleph-mxc-b" filter="url(#mxB)" style="color: oklch(0.55 0.22 260);">
          <use href="#aleph-glyph" x="35" y="35" width="130" height="130"/>
        </g>
      </svg>
    </div>

    <div class="spread-control">
      <span>← wider</span>
      <input type="range" id="spread-slider" min="0" max="1" step="0.01" value="1" aria-label="Horizontal spread">
      <span>tighter →</span>
    </div>

    <p class="aleph-caption">An aleph lava lamp that I made just because it is nice to look at (I think the technical term for such a thing is "art"). Loosely inspired by <a href="https://web.mit.edu/allanmc/www/borgesaleph.pdf">Borges,</a> even if he only saw a false Aleph.</p>
  </main>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark') {
      html.classList.add('dark');
      themeIcon.textContent = '☀';
    } else if (savedTheme === 'light') {
      html.classList.add('light');
      themeIcon.textContent = '☾';
    } else if (systemPrefersDark) {
      themeIcon.textContent = '☀';
    }

    themeToggle.addEventListener('click', () => {
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('theme', 'light');
        themeIcon.textContent = '☾';
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        themeIcon.textContent = '☀';
      }
    });
  </script>

  <script>
    (function () {
      const alephEls = [
        { el: document.querySelector('.aleph-mxc-r'), peakX:  6, peakY: -3 },
        { el: document.querySelector('.aleph-mxc-g'), peakX: -5, peakY:  5 },
        { el: document.querySelector('.aleph-mxc-b'), peakX: -2, peakY: -7 },
      ];

      // Suppress any residual CSS animation on these elements
      alephEls.forEach(a => { a.el.style.animation = 'none'; });

      const slider = document.getElementById('spread-slider');

      // slider=1 (right, tightest) → multiplier 1  → current ~6 px peaks, 9 s period
      // slider=0 (left, widest)    → multiplier 12 → ~72 px peaks, 108 s period
      // Angular speed (rad/ms) stays constant so px/ms is preserved; only distance & period grow.
      const BASE_PERIOD_MS = 9000;
      const MAX_MULT = 12;

      function mult() {
        return 1 + (MAX_MULT - 1) * (1 - parseFloat(slider.value));
      }

      let phase = 0;
      let lastTs = null;

      function tick(ts) {
        if (lastTs === null) lastTs = ts;
        const dt = ts - lastTs;
        lastTs = ts;

        const m = mult();
        // Angular speed = 2π / (BASE_PERIOD * m), constant regardless of m because
        // peak also scales by m → peak × ω stays fixed (same px/ms at peak).
        phase = (phase + (2 * Math.PI / (BASE_PERIOD_MS * m)) * dt) % (2 * Math.PI);

        // Smooth 0 → 1 → 0 envelope (half-cosine, matches ease-in-out feel)
        const f = (1 - Math.cos(phase)) / 2;

        alephEls.forEach(a => {
          a.el.style.transform = `translate(${a.peakX * m * f}px, ${a.peakY * f}px)`;
        });

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>

  <script>
    (function () {
      const alephEls = [
        { el: document.querySelector('.aleph-mxc-r'), peakX:  6, peakY: -3 },
        { el: document.querySelector('.aleph-mxc-g'), peakX: -8, peakY:  5 },
        { el: document.querySelector('.aleph-mxc-b'), peakX: -2, peakY: -7 },
      ];

      alephEls.forEach(a => { a.el.style.animation = 'none'; });

      const slider = document.getElementById('spread-slider');

      // slider=1 (right, tightest) → mult 1  → original peaks, 9 s period
      // slider=0 (left, widest)    → mult 12 → peaks ×12, period ×12
      // Angular speed = 2π/(BASE_PERIOD×m): as m grows, ω shrinks but peak grows by m,
      // so peak×ω = constant → px/ms at peak is preserved.
      const BASE_PERIOD_MS = 9000;
      const MAX_MULT = 12;

      function mult() {
        return 1 + (MAX_MULT - 1) * (1 - parseFloat(slider.value));
      }

      let phase = 0;
      let lastTs = null;

      function tick(ts) {
        if (lastTs === null) lastTs = ts;
        const dt = ts - lastTs;
        lastTs = ts;

        const m = mult();
        phase = (phase + (2 * Math.PI / (BASE_PERIOD_MS * m)) * dt) % (2 * Math.PI);

        // Half-cosine envelope: smooth 0 → 1 → 0
        const f = (1 - Math.cos(phase)) / 2;

        alephEls.forEach(a => {
          a.el.style.transform = `translate(${a.peakX * m * f}px, ${a.peakY * f}px)`;
        });

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
